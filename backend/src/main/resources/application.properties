spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maplewood}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security Configuration (Defaults, override with ENV)
security.student.username=${STUDENT_USERNAME:student}
security.student.password=${STUDENT_PASSWORD:password}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:admin}

# Java 25 / Spring Boot 4.0 Features
spring.threads.virtual.enabled=true
