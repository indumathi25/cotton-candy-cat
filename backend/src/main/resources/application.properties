spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:database/maplewood_school.sqlite?journal_mode=WAL&busy_timeout=5000}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

# 🔐 Security Configuration (Defaults, override with ENV)
security.student.username=${STUDENT_USERNAME:student}
security.student.password=${STUDENT_PASSWORD:password}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:admin}
