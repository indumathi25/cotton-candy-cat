# Test configuration — uses the same PostgreSQL as production (via env vars in CI, or local Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maplewood}
spring.datasource.username=${DB_USERNAME:maplewood}
spring.datasource.password=${DB_PASSWORD:maplewood}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
