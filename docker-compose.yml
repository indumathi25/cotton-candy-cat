services:
  backend:
    image: ghcr.io/indumathi25/cotton-candy-cat/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maplewood-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/maplewood
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - STUDENT_USERNAME=${STUDENT_USERNAME}
      - STUDENT_PASSWORD=${STUDENT_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - maplewood-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: [ "CMD", "curl", "-f", "-u", "admin:admin", "http://localhost:8080/api/courses?size=1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: maplewood-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=maplewood
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maplewood-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d maplewood" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ghcr.io/indumathi25/cotton-candy-cat/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_STUDENT_USERNAME=${VITE_STUDENT_USERNAME:-student}
        - VITE_STUDENT_PASSWORD=${VITE_STUDENT_PASSWORD:-password}
        - VITE_ADMIN_USERNAME=${VITE_ADMIN_USERNAME:-admin}
        - VITE_ADMIN_PASSWORD=${VITE_ADMIN_PASSWORD:-admin}
    container_name: maplewood-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maplewood-network
    restart: unless-stopped

networks:
  maplewood-network:
    driver: bridge

volumes:
  postgres_data:
